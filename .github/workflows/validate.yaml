name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
  push:
    branches: [main]
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@b9e339252a1336b2d06d403d90797902673a1064
        with:
          project_file: 'project.yaml'
          check_links: 'true'

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@b9e339252a1336b2d06d403d90797902673a1064
        with:
          maintainers_file: 'maintainers.yaml'
          # Disabled until the LFX LLT issue is resolved, matching the upstream
          # recommendation. Maintainer verification is done manually for now.
          # LFX_AUTH_TOKEN is not configured on this repository, so leaving this
          # on only skips the check silently and implies a gate that is not there.
          verify_maintainers: 'false'
          check_links: 'true'
